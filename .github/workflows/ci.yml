name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: |
          luarocks install luacheck

      - name: Run luacheck
        run: |
          luacheck src/ --no-color --quiet 2>&1 || exit_code=$?
          echo "Luacheck exit code: ${exit_code:-0}"
          if [ "${exit_code:-0}" -gt 1 ]; then
            echo "Luacheck failed with errors"
            exit 1
          fi
          echo "Lint check completed (warnings allowed)"

  test:
    name: Test (Lua ${{ matrix.lua-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        lua-version: ["5.1", "5.2", "5.3", "5.4", "5.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua (5.1–5.4)
        if: matrix.lua-version != '5.5'
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Install Lua 5.5
        if: matrix.lua-version == '5.5'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.5

      - name: Install LuaRocks
        if: matrix.lua-version != '5.5'
        uses: leafo/gh-actions-luarocks@v4

      - name: Run tests
        run: |
          lua spec/run.lua

  test-luajit:
    name: Test (LuaJIT)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Run tests
        run: |
          luajit spec/run.lua

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, test-luajit]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.test-luajit.result }}" != "success" ]; then
            echo "LuaJIT tests failed"
            exit 1
          fi
          echo "All checks passed!"
